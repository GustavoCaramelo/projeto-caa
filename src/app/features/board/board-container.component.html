<main class="w-full max-w-7xl mx-auto px-3 sm:px-6 py-3 sm:py-4 flex flex-col gap-3 sm:gap-4 h-full">
  <!-- Top Communication Phrase Bar (Visual Voice) -->
  <app-sensory-phrase-bar />

  <!-- ============================================================== -->
  <!-- 1. MOBILE BREAKPOINT (< 768px): Coluna Única + Rolagem Suave   -->
  <!-- ============================================================== -->
  <div class="flex md:hidden flex-col gap-5 pb-10 w-full overflow-y-auto">
    <!-- Silhueta Humana no Topo -->
    <section class="w-full">
      <app-silhouette />
    </section>

    <!-- Estados Gerais do Corpo (Grid 2x2) -->
    <section class="w-full">
      <app-systemic-states />
    </section>

    <!-- Emoções (Grid 2x2 com rolagem suave) -->
    <section class="w-full">
      <app-emotions-board />
    </section>
  </div>

  <!-- ============================================================== -->
  <!-- 2. TABLET BREAKPOINT (768px - 1024px): Split Screen com Abas    -->
  <!-- ============================================================== -->
  <div class="hidden md:flex lg:hidden flex-1 gap-5 overflow-hidden h-[calc(100vh-130px)]">
    <!-- Lado Esquerdo Fixo: Silhueta Humana -->
    <aside class="w-[45%] flex flex-col justify-center items-center overflow-y-auto pr-1">
      <app-silhouette />
    </aside>

    <!-- Lado Direito: Sistema de Abas Grandes + Grid 3x3 -->
    <section class="w-[55%] flex flex-col gap-3 overflow-hidden bg-white/60 p-4 rounded-3xl border-2 border-[#DCE6E0]">
      <!-- Abas Grandes de Alternância (Touch Targets >= 48px) -->
      <nav class="flex gap-2 w-full shrink-0" role="tablist" aria-label="Categorias de Comunicação">
        <button type="button" role="tab" [attr.aria-selected]="commState.activeTab() === 'EMOTIONS'"
          (click)="onTabChange('EMOTIONS')"
          class="flex-1 min-h-[48px] py-2 px-3 rounded-2xl font-black text-xs md:text-sm tracking-wider uppercase sensory-fade focus:outline-none cursor-pointer border-2"
          [class.bg-[#E3EFE7]]="commState.activeTab() === 'EMOTIONS'"
          [class.border-[#7FA88E]]="commState.activeTab() === 'EMOTIONS'"
          [class.text-[#2E4237]]="commState.activeTab() === 'EMOTIONS'"
          [class.bg-[#F4F7F5]]="commState.activeTab() !== 'EMOTIONS'"
          [class.border-[#D7E2DC]]="commState.activeTab() !== 'EMOTIONS'"
          [class.text-[#586A64]]="commState.activeTab() !== 'EMOTIONS'">
          EMOÇÕES
        </button>

        <button type="button" role="tab" [attr.aria-selected]="commState.activeTab() === 'SYSTEMIC'"
          (click)="onTabChange('SYSTEMIC')"
          class="flex-1 min-h-[48px] py-2 px-3 rounded-2xl font-black text-xs md:text-sm tracking-wider uppercase sensory-fade focus:outline-none cursor-pointer border-2"
          [class.bg-[#F6EFE6]]="commState.activeTab() === 'SYSTEMIC'"
          [class.border-[#BE9D80]]="commState.activeTab() === 'SYSTEMIC'"
          [class.text-[#483321]]="commState.activeTab() === 'SYSTEMIC'"
          [class.bg-[#F4F7F5]]="commState.activeTab() !== 'SYSTEMIC'"
          [class.border-[#D7E2DC]]="commState.activeTab() !== 'SYSTEMIC'"
          [class.text-[#586A64]]="commState.activeTab() !== 'SYSTEMIC'">
          FOME E SONO
        </button>
      </nav>

      <!-- Conteúdo da Aba Ativa em Grid 3x3 -->
      <div class="flex-1 overflow-y-auto pr-1">
        @if (commState.activeTab() === 'EMOTIONS') {
        <app-emotions-board />
        } @else {
        <div class="flex flex-col gap-4">
          <app-systemic-states />

          <!-- Caixa de Suporte Sensorial Adicional -->
          <div class="p-4 bg-[#EDF3EF] rounded-2xl border border-[#CADBD1] text-center">
            <span class="text-xs font-bold tracking-wider text-[#546E63] uppercase">
              VOCÊ PODE TAMBÉM TOCAR NA SILHUETA AO LADO A QUALQUER MOMENTO.
            </span>
          </div>
        </div>
        }
      </div>
    </section>
  </div>

  <!-- ============================================================== -->
  <!-- 3. DESKTOP BREAKPOINT (> 1024px): Panorâmico Centralizado      -->
  <!-- Alto uso de White Space, descanso visual, sem scrollbars       -->
  <!-- ============================================================== -->
  <div class="hidden lg:grid grid-cols-12 gap-6 items-start h-[calc(100vh-125px)] overflow-hidden py-1">
    <!-- Coluna Esquerda: Emoções ("O que eu sinto?") (4 colunas) -->
    <div class="col-span-4 h-full flex flex-col bg-white/50 p-3 rounded-3xl border-2 border-[#DCE5DF]">
      <app-emotions-board />
    </div>

    <!-- Coluna Central: Silhueta Humana ("Meu Corpo") (5 colunas) -->
    <div class="col-span-5 h-full flex flex-col items-center px-2">
      <app-silhouette />
    </div>

    <!-- Coluna Direita: Estados Sistêmicos + Guia de Acolhimento (3 colunas) -->
    <div class="col-span-3 h-full flex flex-col justify-between bg-white/50 p-4 rounded-3xl border-2 border-[#DCE5DF]">
      <div class="flex flex-col gap-4">
        <app-systemic-states />
      </div>

      <!-- Card de Previsibilidade e Descanso Visual -->
      <footer class="mt-auto p-4 rounded-2xl bg-[#EEF5F1] border border-[#CADED2] flex flex-col gap-2">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-[#7CA88E]"></span>
          <span class="text-xs font-extrabold text-[#384A43] tracking-wider uppercase">
            AMBIENTE SEGURO
          </span>
        </div>
        <p class="text-[11px] leading-relaxed font-bold text-[#556962] uppercase tracking-wide">
          ESTA TELA NÃO EMITE SONS REPENTINOS E FOI PROJETADA PARA SEU CONFORTO.
        </p>
      </footer>
    </div>
  </div>
</main>
